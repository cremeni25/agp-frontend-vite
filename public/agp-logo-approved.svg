<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" role="img" aria-labelledby="title desc">
  <title id="title">AGP Sports Intelligence Platform</title>
  <desc id="desc">Logomarca oficial aprovada do AGP.</desc>
  <defs>
    <linearGradient id="agpText" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#123a8f"/>
      <stop offset="1" stop-color="#061533"/>
    </linearGradient>
    <linearGradient id="agpAccent" x1="0" x2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(95 55)">
