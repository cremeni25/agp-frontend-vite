    <path d="M668 215 C775 207 820 186 871 149 C915 118 952 118 990 151 C1016 174 1034 190 1056 200" fill="none" stroke="url(#agpAccent)" stroke-width="22" stroke-linecap="round"/>
    <path d="M726 221 C811 212 866 188 915 145 C957 108 995 80 1043 69" fill="none" stroke="#1e40af" stroke-width="9" stroke-linecap="round"/>

    <circle cx="900" cy="145" r="18" fill="#0ea5e9" filter="url(#glow)"/>
    <circle cx="951" cy="161" r="22" fill="#e5e7eb" stroke="#0b2556" stroke-width="5"/>
    <circle cx="1043" cy="69" r="24" fill="#0ea5e9" filter="url(#glow)"/>

    <path d="M80 188 L122 188 L106 135 Z" fill="#0ea5e9"/>

    <text x="18" y="306" font-family="Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="9" fill="#e5e7eb">SPORTS INTELLIGENCE PLATFORM</text>
